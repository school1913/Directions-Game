<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Where Is It?</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(160deg,#ffe4ec,#e3f0ff);color:#3b2f2a;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:12px}h1,h2{margin:.2em 0}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.08);margin:10px 0}.c{text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 18px;color:#fff;background:#3a86ff;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}
button.p{background:#ff5a7a}button.g{background:#2ec27e}button.o{background:#ffb703;color:#3b2f2a}button:disabled{opacity:.5}
input{font:inherit;padding:10px 14px;border-radius:12px;border:3px solid #ddd;width:100%;max-width:280px;text-align:center}
.big{font-size:56px;font-weight:800;letter-spacing:8px;color:#ff5a7a}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.pc{background:#fff;border-radius:16px;padding:8px 12px;text-align:center;min-width:90px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ccc;padding:0}.on{box-shadow:0 0 0 4px #3a86ff}
.chip{background:#eee;color:#3b2f2a;padding:6px 12px;box-shadow:none}.chip.on{background:#3a86ff;color:#fff}
#map{width:100%;height:auto;background:#f1ede7;border-radius:16px;display:block}.pl{cursor:pointer}.pl text{font-size:15px;font-weight:700;fill:#3b2f2a}.pl:hover image{transform:scale(1.04)}.dn{opacity:.45;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.q{font-size:26px;font-weight:800;color:#ff5a7a}.bar{height:14px;background:#eee;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%}
.ov{position:fixed;inset:0;background:rgba(30,20,60,.75);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}.ov .card{max-width:620px;width:100%}
.box{flex:1;min-width:150px;background:#fff7d6;border:4px dashed #ffb703;border-radius:18px;padding:14px;font-size:20px;font-weight:700;color:#3b2f2a;box-shadow:none}.box span{font-size:44px;display:block}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0}.pod div{width:30%;max-width:190px;text-align:center}.pod .st{border-radius:14px 14px 0 0;color:#fff;font-size:44px;font-weight:800;padding-top:8px}
.cf{position:fixed;top:-30px;font-size:28px;animation:f 4s linear forwards;z-index:10;pointer-events:none}@keyframes f{to{transform:translateY(110vh) rotate(540deg)}}
#av{transition:transform .7s ease}#ar{transition:transform .3s}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sleep=ms=>new Promise(r=>setTimeout(r,ms));window.onerror=(m,s,l)=>{$('#app').innerHTML='<div class="card">⚠️ '+E(m)+' (line '+l+')</div>'};
// [image, id, name, three reward items]
const P=[['ramen','ramen shop',['🍜 Ramen','🥟 Dumplings','🍶 Soy sauce bottle']],['kimbap','kimbap shop',['🍙 Kimbap','🍢 Fish cake','🥒 Pickled radish']],['taco','taco shop',['🌮 Taco','🌶️ Hot sauce','🌽 Corn']],['icecream','ice cream shop',['🍦 Ice cream','🍨 Sundae','🍧 Shaved ice']],['pizza','pizza shop',['🍕 Pizza slice','🧀 Cheese','🍅 Tomato']],['bakery','bakery',['🍞 Bread','🥐 Croissant','🧁 Cupcake']],['bookstore','bookstore',['📘 Book','✏️ Pencil','🔖 Bookmark']],['police','police station',['🚓 Police car','👮 Police hat','🔦 Flashlight']],['zoo','zoo',['🐒 Monkey','🦁 Lion','🐘 Elephant']],['market','market',['🍎 Apple','🥕 Carrot','🍉 Watermelon']],['school','school',['🎒 Backpack','📏 Ruler','🔔 Bell']],['hospital','hospital',['💊 Medicine','🩹 Bandage','🩺 Stethoscope']],['bus','bus stop',['🎟️ Ticket','🚌 Bus','⏰ Clock']],['flower','flower shop',['🌹 Rose','🌻 Sunflower','💐 Bouquet']],['restaurant','restaurant',['🍝 Spaghetti','🥗 Salad','🍰 Cake']],['park','park',['🪁 Kite','⚽ Ball','🌳 Tree']],['bank','bank',['💰 Money bag','🐷 Piggy bank','💳 Card']],['library','library',['📚 Books','🔍 Magnifier','🤫 Quiet sign']],['university','university',['🎓 Cap','📜 Diploma','🔬 Microscope']]].map(a=>({img:a[0],name:a[1],items:a[2]}));
const COLS=5,ROWS=4,nx=c=>40+184*c,ny=r=>40+140*r,DIR=[[0,-1],[1,0],[0,1],[-1,0]];
const SK=['#ffdbb4','#f1c27d','#c68642','#8d5524','#5c3a21'],HC=['#2b1b12','#6b3e1e','#d9a441','#c0392b','#3a86ff','#222'],SH=['#ff5a7a','#3a86ff','#2ec27e','#ffb703','#9b5de5','#ff7b00'];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let sb=null,cfgErr='';try{if(window.supabase&&!/PASTE/.test(window.SB_URL||'PASTE'))sb=supabase.createClient(String(SB_URL).trim(),String(SB_KEY).trim())}catch(e){cfgErr=e.message}
const S={v:'home',code:'',host:0,me:null,done:[],t:null,pos:{c:2,r:4},h:0,seg:null,act:'',busy:0,msg:'',said:'',acc:null,players:[],status:'lobby',shown:''};
const rnd=n=>Math.floor(Math.random()*n),randAv=()=>({sk:rnd(5),hs:rnd(4),hc:rnd(6),sh:rnd(6),ac:0});
function av(c,arm,back,s=80){const sk=SK[c.sk],hc=HC[c.hc],A=(x,d,u)=>`<path d="M${x} 40L${u?x+d*12:x+d*4} ${u?16:58}" stroke="${sk}" stroke-width="8" stroke-linecap="round"/>`;
const hair=[`<path d="M15 22a15 15 0 0 1 30 0q-15-8-30 0z"/>`,`<path d="M15 22a15 15 0 0 1 30 0v22h-6V24q-9-6-18 0v20h-6z"/>`,`<circle cx="30" cy="5" r="7"/><path d="M15 22a15 15 0 0 1 30 0q-15-8-30 0z"/>`,`<path d="M15 22l2-14 6 8 7-12 7 12 6-8 2 14q-15-8-30 0z"/>`][c.hs];
return `<svg viewBox="0 0 60 80" width="${s}" height="${s*4/3}"><rect x="21" y="60" width="7" height="16" rx="3" fill="#334"/><rect x="32" y="60" width="7" height="16" rx="3" fill="#334"/>${A(17,-1,arm==='left')}${A(43,1,arm==='right')}<rect x="17" y="36" width="26" height="28" rx="9" fill="${SH[c.sh]}"/><circle cx="30" cy="22" r="14" fill="${sk}"/>${back?`<circle cx="30" cy="22" r="15" fill="${HC[c.hc]}"/>`:`<g fill="${hc}">${hair}</g><circle cx="25" cy="23" r="2" fill="#222"/><circle cx="35" cy="23" r="2" fill="#222"/><path d="M25 29q5 4 10 0" stroke="#222" fill="none" stroke-width="2" stroke-linecap="round"/>`}${c.ac==1&&!back?`<g stroke="#222" fill="none" stroke-width="1.6"><circle cx="25" cy="23" r="4.5"/><circle cx="35" cy="23" r="4.5"/><path d="M29.5 23h1"/></g>`:''}${c.ac==2?`<path d="M15 20a15 15 0 0 1 30 0z" fill="#e63946"/><rect x="28" y="17" width="22" height="5" rx="2" fill="#e63946"/>`:''}</svg>`}
function conf(){for(let i=0;i<40;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🎉','⭐','🎊','✨'][i%4];e.style.left=rnd(100)+'vw';e.style.animationDelay=Math.random()*2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}}
const spk=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}};
// ---------- screens ----------
function render(){S.shown=S.status;const a=$('#app'),v=S.v;
if(v==='home'){const q=new URLSearchParams(location.search).get('g')||'';a.innerHTML=`<div class="card c"><h1>🗺️ Where Is It?</h1><p>Give directions. Find the place. Win points!</p>${sb?'':'<p style="color:#c0392b"><b>Setup needed:</b> check config.js (Supabase URL and key). '+E(cfgErr)+'</p>'}<div class="row"><div><p><b>🎒 Students</b></p><input id="cd" placeholder="Game code" maxlength="4" value="${E(q)}" style="text-transform:uppercase"><br><br><input id="nm" placeholder="Your name" maxlength="14"><br><br><button class="p" onclick="join()">Join</button></div><div><p><b>👩‍🏫 Teacher</b></p><button class="g" onclick="hostGame()">Host a game</button></div></div><p id="err" style="color:#c0392b"></p></div>`}
if(v==='lobby'){a.innerHTML=`<div class="card c"><h2>You're in, ${E(S.me.name)}! Build your avatar</h2><div id="prev"></div><div class="row" id="ed"></div><p>⏳ Waiting for the teacher to start...</p></div><div class="card c"><b>Classmates</b><div class="row" id="pl"></div></div>`;edit();upd()}
if(v==='host'){const u=location.origin+location.pathname+'?g='+S.code;a.innerHTML=S.status==='lobby'?`<div class="card c"><h2>Scan to join</h2><div class="row"><div id="qr"></div><div><div>or go to</div><b>${E(u.replace(/^https?:\/\//,'').split('?')[0])}</b><div class="big">${S.code}</div></div></div><div class="row"><button class="g" id="st" onclick="setSt('playing')">▶ Start game</button></div></div><div class="card c"><b>Players (<span id="cnt">0</span>)</b><div class="row" id="pl"></div></div>`:`<div class="card"><div class="top"><h2>Live scores</h2><button class="p" onclick="if(confirm('End the game now?'))setSt('ended')">⏹ End game</button></div><div id="pl"></div></div>`;
if(S.status==='lobby')new QRCode($('#qr'),{text:u,width:190,height:190});upd()}
if(v==='play')play();
if(v==='end'||S.status==='ended'&&v!=='home'){S.v='end';const L=S.players,me=S.me?L.findIndex(p=>p.id===S.me.id)+1:0;a.innerHTML=`<div class="card c"><h1>🏆 Game over!</h1><div class="pod">${[1,0,2].map(i=>L[i]?`<div>${av(L[i].avatar,'',0,i==0?90:70)}<b>${E(L[i].name)}</b><div class="st" style="background:${['#ffb703','#adb5bd','#cd7f32'][i]};height:${[170,120,90][i]}px">${i+1}<div style="font-size:18px">⭐ ${L[i].points}</div></div></div>`:'<div></div>').join('')}</div>${me>3?`<p>You finished #${me} with ${S.me.points} points. Great work!</p>`:''}<div class="row">${L.slice(3).map((p,i)=>`<div class="pc">#${i+4} ${E(p.name)} ⭐${p.points}</div>`).join('')}</div></div>`;conf()}}
function upd(){const L=S.players,p=$('#pl');if(!p)return;if(S.v==='host'&&S.status==='playing'){p.innerHTML=L.map((x,i)=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #eee"><span>${i+1}. ${av(x.avatar,'',0,34)} <b>${E(x.name)}</b></span><span>${x.done}/19 places · ⭐ ${x.points}</span></div>`).join('')||'Waiting for scores...';return}
if($('#cnt'))$('#cnt').textContent=L.length;p.innerHTML=L.map(x=>`<div class="pc">${av(x.avatar,'',0,60)}<br><b>${E(x.name)}</b></div>`).join('')}
function edit(){$('#prev').innerHTML=av(S.me.avatar,'',0,120);const a=S.me.avatar,o=(k,n,f)=>`<div>${Array.from({length:n},(_,i)=>f(i,a[k]==i)).join(' ')}</div>`,sw=(k,C)=>(i,on)=>`<button class="sw ${on?'on':''}" style="background:${C[i]}" onclick="ed('${k}',${i})"></button>`,ch=(k,L)=>(i,on)=>`<button class="chip ${on?'on':''}" onclick="ed('${k}',${i})">${L[i]}</button>`;
$('#ed').innerHTML=`<div>Skin ${o('sk',5,sw('sk',SK))}</div><div>Hair color ${o('hc',6,sw('hc',HC))}</div><div>Shirt ${o('sh',6,sw('sh',SH))}</div><div>Hair ${o('hs',4,ch('hs',['Short','Long','Bun','Spiky']))}</div><div>Extra ${o('ac',3,ch('ac',['None','👓','🧢']))}</div>`}
async function ed(k,i){S.me.avatar[k]=i;edit();save();if(sb)await sb.from('players').update({avatar:S.me.avatar}).eq('id',S.me.id)}
const save=()=>localStorage.setItem('wi'+S.code,JSON.stringify({me:S.me,done:S.done}));
// ---------- teacher / join ----------
async function hostGame(){if(!sb)return alert('Finish setup in config.js first.');const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=L[rnd(L.length)];const{error}=await sb.from('games').insert({code:c});if(error)return alert(error.message);Object.assign(S,{code:c,host:1,v:'host',status:'lobby'});render()}
async function setSt(s){await sb.from('games').update({status:s}).eq('code',S.code);S.status=s;if(s==='ended')await tick();render()}
async function join(){const code=$('#cd').value.trim().toUpperCase(),nm=$('#nm').value.trim(),er=m=>$('#err').textContent=m;if(!sb)return er('Setup needed.');if(!code||!nm)return er('Enter the code and your name.');
const{data:g}=await sb.from('games').select('status').eq('code',code).maybeSingle();if(!g)return er('Game not found.');if(g.status==='ended')return er('This game has ended.');
const old=JSON.parse(localStorage.getItem('wi'+code)||'null');let me=old&&old.me;if(!me){const{data,error}=await sb.from('players').insert({game:code,name:nm,avatar:randAv()}).select().single();if(error)return er(error.message);me=data}
Object.assign(S,{code,me,done:old?old.done:[],status:g.status,v:g.status==='playing'?'play':'lobby'});save();render()}
// ---------- polling ----------
async function tick(){if(!sb||!S.code)return;const{data:g}=await sb.from('games').select('status').eq('code',S.code).maybeSingle();if(!g)return;S.status=g.status;
if(S.host||S.status==='ended'||S.v==='lobby'){const{data:p}=await sb.from('players').select('*').eq('game',S.code).order('points',{ascending:false});S.players=p||[]}
if(!S.host&&S.v==='lobby'&&S.status==='playing')S.v='play';
if(S.shown!==S.status||S.v==='play'&&!$('#map')&&S.status!=='ended')render();else upd()}
setInterval(tick,2000);
// ---------- student game ----------
function play(){$('#app').innerHTML=`<div class="card"><div class="top"><span>${av(S.me.avatar,'',0,30)} ${E(S.me.name)}</span><span id="sc"></span></div></div><svg id="map" viewBox="0 0 1000 640"><g id="rd"></g><g id="pls"></g><g transform="translate(${nx(2)} ${ny(4)})"><ellipse cy="4" rx="24" ry="8" fill="#ffd60a" stroke="#000"/><path d="M0 0C-17-20-17-46 0-46S17-20 0 0z" fill="#e63950" stroke="#000"/><circle cy="-32" r="6" fill="#fff"/></g><g id="av"><polygon id="ar" points="0,-46 9,-34 -9,-34" fill="#ff5a7a"/><g id="avi" transform="translate(-24,-32)"></g></g></svg><div class="card c" id="pn"></div>`;
const rs=[];for(let c=0;c<=COLS;c++)rs.push(`M${nx(c)} ${ny(0)}L${nx(c)} ${ny(ROWS)}`);for(let r=0;r<=ROWS;r++)rs.push(`M${nx(0)} ${ny(r)}L${nx(COLS)} ${ny(r)}`);
$('#rd').innerHTML=rs.map(d=>`<path d="${d}" stroke="#52453d" stroke-width="28" stroke-linecap="square"/>`).join('')+rs.map(d=>`<path d="${d}" stroke="#ffc94d" stroke-width="3" stroke-dasharray="12 9" fill="none"/>`).join('');reset();places();ui()}
function places(){$('#pls').innerHTML=P.map((p,i)=>{const c=i%COLS,r=Math.floor(i/COLS),d=S.done.includes(i);return`<g class="pl ${d?'dn':''}" onclick="pick(${i})">${S.t===i?`<rect x="${nx(c)+15}" y="${ny(r)+14}" width="154" height="112" rx="14" fill="#fff3b0" stroke="#ff5a7a" stroke-width="4"/>`:''}<image href="img/${p.img}.png" x="${nx(c)+17}" y="${ny(r)+16}" width="150" height="92" preserveAspectRatio="xMidYMid meet"/><text x="${nx(c)+92}" y="${ny(r)+122}" text-anchor="middle">${d?'✓ ':''}${p.name}</text></g>`}).join('')}
function setAv(arm){$('#av').style.transform=`translate(${nx(S.pos.c)}px,${ny(S.pos.r)}px)`;$('#ar').style.transform=`rotate(${S.h*90}deg)`;$('#avi').innerHTML=av(S.me.avatar,arm||'',1,48)}
function reset(){if(S.busy)return;S.pos={c:2,r:4};S.h=0;S.seg=null;S.act='';S.msg='';setAv()}
function pick(i){if(S.busy||S.done.includes(i)||S.v!=='play')return;S.t=i;reset();places();ui();spk(`Where is the ${P[i].name}?`)}
function ui(){if(!$('#pn'))return;const t=S.t;$('#sc').innerHTML=`⭐ ${S.me.points||0} &nbsp; ${S.done.length}/${P.length} places`;
$('#pn').innerHTML=t==null?`<div class="q">👆 Tap a place on the map!</div>`:`<div class="q">Where is the ${P[t].name}? <button class="chip" onclick="spk('Where is the ${P[t].name}?')">🔊</button></div><p>Say: <b>"Go straight two blocks and turn left."</b> Then: <b>"It's on your left."</b></p>${SR?`<button class="p" ${S.busy||S.lis?'disabled':''} onclick="speak()">${S.lis?'👂 Listening...':'🎤 Speak'}</button>`:`<input id="tx" placeholder="Type your directions"> <button class="p" onclick="handle($('#tx').value,1)">Go</button>`} <button class="o" onclick="reset();ui()">↺ Start over</button>${S.said?`<p>I heard: <i>"${E(S.said)}"</i></p>`:''}${S.acc!=null?`<div class="bar"><i style="width:${S.acc}%;background:${S.acc>=80?'#2ec27e':'#ff5a7a'}"></i></div><small>Pronunciation ${S.acc}% (need 80%)</small>`:''}<p><b>${E(S.msg)}</b></p>`}
function listen(){return new Promise((ok,no)=>{const r=new SR();r.lang='en-US';r.onresult=e=>ok({t:e.results[0][0].transcript,c:e.results[0][0].confidence});r.onerror=e=>no(e.error);r.onend=()=>no('none');r.start()})}
async function speak(){if(S.busy||S.t==null)return;S.lis=1;ui();try{const x=await listen();S.lis=0;handle(x.t,x.c)}catch(e){S.lis=0;S.msg=e==='not-allowed'?'🎤 Please allow the microphone.':"I didn't hear you. Try again!";ui()}}
const NUM={a:1,one:1,two:2,to:2,too:2,three:3,four:4,for:4,five:5,six:6};
function parse(t){t=' '+t.toLowerCase().replace(/[^a-z0-9' ]/g,' ');const re=new RegExp(`straight(?: ahead)?(?: (\\d|${Object.keys(NUM).join('|')}))?(?: blocks?)?|turn (left|right)|(?:it'?s|it is) on your (left|right)`,'g'),W=s=>s.replace(/\b(and|then|please|okay|ok|now|the|a|go|walk)\b/g,' ').trim().split(/\s+/).filter(Boolean).length;let m,ops=[],mw=0,end=0;
while(m=re.exec(t)){end=re.lastIndex;mw+=W(m[0]);ops.push(m[2]?{k:'turn',v:m[2]}:m[3]?{k:'say',v:m[3]}:{k:'go',v:NUM[m[1]]||+m[1]||1})}return{ops,cov:mw/Math.max(1,W(t.slice(0,end)))}}
function handle(t,c){S.said=t;const p=parse(t);if(!p.ops.length){S.acc=null;S.msg='Try: "Go straight two blocks and turn left."';return ui()}const a=Math.min(100,Math.round(100*(c||.9)*p.cov));S.acc=a;if(a<80){S.msg=`Almost! Say it again clearly (${a}%).`;return ui()}S.msg='';ui();exec(p.ops)}
const ahead=()=>{const d=DIR[S.h],n={c:S.pos.c+d[0],r:S.pos.r+d[1]};return n.c<0||n.c>COLS||n.r<0||n.r>ROWS?null:{a:S.pos,b:n,h:S.h}};
function blk(g,side){const v=DIR[g.h],l=side==='left'?[v[1],-v[0]]:[-v[1],v[0]],c=Math.floor((g.a.c+g.b.c)/2+l[0]/2),r=Math.floor((g.a.r+g.b.r)/2+l[1]/2);return c<0||c>=COLS||r<0||r>=ROWS?-1:r*COLS+c}
async function exec(ops){S.busy=1;ui();for(const o of ops){if(o.k==='go'){for(let i=0;i<o.v;i++){const g=ahead();if(!g){S.msg='🚧 The road ends here!';break}S.seg=g;S.pos=g.b;S.act='walk';setAv();await sleep(780)}}
else if(o.k==='turn'){S.h=(S.h+(o.v==='right'?1:3))%4;S.act='turn';setAv();await sleep(500)}
else{setAv(o.v);await sleep(1000);const g=S.act==='walk'?S.seg:ahead(),T=S.t;if(!g)S.msg='There is no place here. Try again!';else{const L=blk(g,'left'),R=blk(g,'right');if((o.v==='left'?L:R)===T){S.busy=0;setAv();return win()}S.msg=(L===T||R===T)?`Look again! It's on your ${o.v==='left'?'right':'left'}.`:"It's not here. Keep going or press Start over."}setAv()}}
S.busy=0;ui()}
function win(){const p=P[S.t],pts=[100,200,300].sort(()=>Math.random()-.5);conf();spk('Congratulations!');const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card c"><h1>🎉 Congratulations!</h1><h3>We got to the ${p.name} successfully!</h3><p>Choose 1 item. Points are hiding behind it!</p><div class="row">${p.items.map((t,i)=>`<button class="box" onclick="take(${i},${pts[i]},this)"><span>${t.split(' ')[0]}</span>${t.split(' ').slice(1).join(' ')}</button>`).join('')}</div><p id="rw"></p></div>`;document.body.appendChild(o)}
async function take(i,pts,b){const o=$('.ov');o.querySelectorAll('.box').forEach(x=>x.disabled=true);b.innerHTML+=`<br>⭐ +${pts}`;S.done.push(S.t);S.me.points=(S.me.points||0)+pts;save();if(sb)sb.from('players').update({points:S.me.points,done:S.done.length}).eq('id',S.me.id);
$('#rw').innerHTML=`<button class="g" id="nx">Continue ▶</button>`;$('#nx').onclick=()=>{o.remove();S.t=null;S.said='';S.acc=null;S.msg=S.done.length===P.length?'🌟 You visited every place!':'';reset();places();ui()}}
render();
</script></body></html>
